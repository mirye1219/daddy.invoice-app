<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>거래명세서</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>


<!-- =====================================================
     인증
====================================================== -->

<div
    class="auth-container"
    id="authContainer"
>

    <div class="auth-box">

        <h1>거래명세서</h1>

        <p>
            접근 코드를 입력하세요
        </p>

        <div
            id="authError"
            class="auth-error"
        ></div>

        <input
            type="password"
            id="accessCode"
            placeholder="접근 코드"
            onkeypress="if(event.key === 'Enter') authenticate()"
        >

        <button onclick="authenticate()">
            접근
        </button>

    </div>

</div>



<!-- =====================================================
     앱
====================================================== -->

<div
    class="app-wrapper"
    id="appWrapper"
>

    <div class="header">

        <button
            class="logout-btn"
            onclick="logout()"
        >
            로그아웃
        </button>

    </div>


    <!-- =================================================
         A4
    ================================================== -->

    <div class="paper">

        <div
            class="invoice-frame"
            id="invoiceFrame"
        >


            <!-- =========================================
                 제목
            ========================================== -->

            <div class="invoice-title">
                거 래 명 세 서
            </div>



            <!-- =========================================
                 상단
            ========================================== -->

            <table class="top-table">

                <colgroup>
                    <col style="width:42%">
                    <col style="width:7%">
                    <col style="width:51%">
                </colgroup>

                <tbody>

                <tr>


                    <!-- ===============================
                         공급받는 자

                                            id="month"

                            <!-- 거래처 -->

                         공급자
                    ================================ -->

                    <td class="supplier-vertical">

                    <!-- ===============================
                         공급자 정보
                    ================================ -->

                        <table class="supplier-table">

                            <colgroup>

                                <col style="width:23%">

                                <col style="width:27%">

                                <col style="width:18%">

                                <col style="width:32%">

                            </colgroup>


                            <tbody>


                            <!-- 등록번호 -->

                            <tr>

                                <td class="label-cell">
                                    등록번호
                                </td>

                                <td
                                    colspan="3"

                                    107-62-66145
                                </td>

                            </tr>

                                <td class="label-cell">

                                </td>

                                <td class="supplier-value">

                                <td class="label-cell">

                                <td class="supplier-name-cell">

                                    ★ 중요 ★

                                    아래 src="..." 안에는
                                    기존 index.html에서 사용하던

                            <!-- 사업장 소재지 -->

                            <tr>

                                <td class="label-cell address-label">

                                    class="address-cell"

                                    1동 1003호
                                    (호매실동, 금호프라자)

                                </td>

                            </tr>


                            <!-- 업태 / 종목 -->

                            <tr>

                                <td class="label-cell">
                                    업 태
                                </td>

                                <td class="supplier-value">
                                    건설
                                </td>

                                <td class="label-cell">
                                    종 목
                                </td>

                                <td class="supplier-value">
                                    건설기계대여

                            </tr>

                    </td>


                </tr>

            </table>



            <!-- =========================================
                 합계 금액
            ========================================== -->

            <table class="total-header-table">

                <colgroup>

                    <col style="width:13%">

                    <col style="width:27%">

                    <col style="width:11%">

                    <col style="width:10%">

                    <col style="width:25%">

                    <col style="width:14%">

                </colgroup>


                <tbody>

                <tr>


                    <td class="total-title">
                        합계금액

                    <td class="currency-open">
                        ( ₩
                    </td>


                    <td

                        class="total-number"

                    <td class="currency-close">

                </tr>

            </table>



            <!-- =========================================
                 거래내역

                 월      6.5
                 일      6.5
                 품목    39
                 수량    7
                 단가    13.67
                 공급    13.67
                 세액    13.66

            ========================================== -->

                <colgroup>

                    <col style="width:6.5%">

                    <col style="width:6.5%">

                    <col style="width:39%">

                    <col style="width:7%">

                    <col style="width:13.67%">

                    <col style="width:13.67%">

                    <col style="width:13.66%">

                </colgroup>


                <thead>

                <tr>

                    <th>
                        월
                    </th>

                    <th>
                        일
                    </th>

                    <th>
                        품 목
                    </th>

                    <th>
                        수 량
                    </th>

                    <th>
                        단 가
                    </th>

                    <th>
                        공급가액
                    </th>

                    <th>
                        세 액
                    </th>

                </tr>

                </thead>


                <tbody id="itemTable">
                </tbody>


                <!-- ===============================
                     계
                ================================ -->

                <tfoot>

                <tr>

                    <td
                        colspan="3"
                        class="sum-label"
                    >
                        계
                    </td>


                    <td>

                        <input
                            class="table-input number"
                            id="sumQty"
                            readonly
                        >

                    </td>


                    <td>
                    </td>


                    <td>

                        <input
                            class="table-input number"
                            id="sumSupply"
                            readonly
                        >

                    </td>


                    <td>

                        <input
                            class="table-input number"
                            id="sumTax"
                            readonly
                        >

                    </td>


                </tr>

                </tfoot>

            </table>



            <!-- =========================================
                 하단

                 위 거래내역과 정확히 같은 7열 사용

                 앞쪽 3칸 = 하나의 공란
                 수량 + 단가 = 합계
                 공급가액 + 세액 = 금액
            ========================================== -->

            <table class="bottom-table">

                <colgroup>

                    <col style="width:6.5%">

                    <col style="width:6.5%">

                    <col style="width:39%">

                    <col style="width:7%">

                    <col style="width:13.67%">

                    <col style="width:13.67%">

                    <col style="width:13.66%">

                </colgroup>


                <tbody>


                <!-- 하단 합계 -->

                <tr>

                    <!--
                    기존 전잔금 + 공란을
                    하나의 큰 공란으로 합침
                    -->

                    <td
                        colspan="3"
                        class="bottom-blank"
                    >
                    </td>


                    <!--
                    수량 + 단가
                    -->

                    <td
                        colspan="2"
                        class="bottom-label"
                    >
                        합 계
                    </td>


                    <!--
                    공급가액 + 세액
                    -->

                    <td colspan="2">

                        <input
                            class="final-total"
                            id="finalTotal"
                            readonly
                        >

                    </td>

                </tr>



                <!-- 비고 -->

                <tr class="notes-row">

                    <td class="bottom-label">
                        비 고
                    </td>


                    <td colspan="6">

                        <textarea
                            id="notes"
                            class="notes-input"
                            placeholder="현장명, 계좌번호, 기타 사항"
                        ></textarea>

                    </td>


                </tr>


                </tbody>

            </table>


        </div>

    </div>



    <!-- =================================================
         버튼
    ================================================== -->

    <div class="buttons">


        <button
            class="btn btn-primary"
            onclick="downloadImage()"
        >
            이미지로 다운로드
        </button>


        <button
            class="btn btn-primary"
            onclick="downloadPDF()"
        >
            PDF로 다운로드
        </button>


        <button
            class="btn btn-secondary"
            onclick="clearForm()"
        >
            초기화
        </button>


    </div>


</div>



<script>

/* =========================================================
   접근 코드
========================================================= */

const VALID_CODES = [
    'code123',
    'access456',
    'user789'
];



/* =========================================================
   인증
========================================================= */

function authenticate() {

    const code =
        document
            .getElementById('accessCode')
            .value;


    if (
        VALID_CODES.includes(code)
    ) {

        sessionStorage.setItem(
            'authenticated',
            'true'
        );


        document
            .getElementById('authContainer')
            .classList
            .add('hidden');


        document
            .getElementById('appWrapper')
            .classList
            .add('active');


        initForm();

    } else {

        document
            .getElementById('authError')
            .textContent =
            '잘못된 코드입니다.';


        document
            .getElementById('accessCode')
            .value =
            '';

    }

}



function logout() {

    sessionStorage.removeItem(
        'authenticated'
    );

    location.reload();

}



/* =========================================================
   숫자 → 한글
========================================================= */

function numToKorean(num) {

    if (num === 0) {
        return '';
    }


    const digits = [
        '',
        '일',
        '이',
        '삼',
        '사',
        '오',
        '육',
        '칠',
        '팔',
        '구'
    ];


    const bigUnits = [
        '',
        '만',
        '억',
        '조'
    ];


    let result = '';

    let bigIndex = 0;

    let n =
        Math.floor(num);


    while (n > 0) {

        const segment =
            n % 10000;


        if (segment > 0) {

            let text = '';


            const thousand =
                Math.floor(
                    segment / 1000
                );


            const hundred =
                Math.floor(
                    (segment % 1000) / 100
                );


            const ten =
                Math.floor(
                    (segment % 100) / 10
                );


            const one =
                segment % 10;



            if (thousand > 0) {

                text +=
                    thousand === 1
                        ? '일천'
                        : digits[thousand] + '천';

            }



            if (hundred > 0) {

                text +=
                    hundred === 1
                        ? '일백'
                        : digits[hundred] + '백';

            }



            if (ten > 0) {

                text +=
                    ten === 1
                        ? '십'
                        : digits[ten] + '십';

            }



            if (one > 0) {

                text +=
                    digits[one];

            }


            result =
                text +
                bigUnits[bigIndex] +
                result;

        }


        n =
            Math.floor(
                n / 10000
            );


        bigIndex++;

    }


    return result;

}



/* =========================================================
   초기화
========================================================= */

function initForm() {

    const today =
        new Date();


    document
        .getElementById('year')
        .value =
        today.getFullYear();


    document
        .getElementById('month')
        .value =
        today.getMonth() + 1;


    document
        .getElementById('day')
        .value =
        today.getDate();



    const tbody =
        document
            .getElementById('itemTable');


    tbody.innerHTML = '';



    /*
    15개 거래 행
    */

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const tr =
            document.createElement('tr');


        tr.innerHTML = `


            <td>

                <input
                    class="table-input number m"
                    type="number"
                    min="1"
                    max="12"
                >

            </td>


            <td>

                <input
                    class="table-input number d"
                    type="number"
                    min="1"
                    max="31"
                >

            </td>


            <td>

                <input
                    class="table-input name"
                    type="text"
                >

            </td>


            <td>

                <input
                    class="table-input number qty"
                    type="number"
                    min="0"
                    step="0.01"
                >

            </td>


            <td>

                <input
                    class="table-input number price"
                    type="text"
                    inputmode="numeric"
                >

            </td>


            <td>

                <input
                    class="table-input number supply"
                    type="text"
                    readonly
                >

            </td>


            <td>

                <input
                    class="table-input number tax"
                    type="text"
                    readonly
                >

            </td>


        `;


        bindRow(
            tr,
            i
        );


        tbody.appendChild(
            tr
        );

    }


    calcTotals();

}



/* =========================================================
   행 이벤트
========================================================= */

function bindRow(
    tr,
    index
) {

    const month =
        tr.querySelector('.m');


    const day =
        tr.querySelector('.d');


    const name =
        tr.querySelector('.name');


    const qty =
        tr.querySelector('.qty');


    const price =
        tr.querySelector('.price');



    /* 단가 콤마 */

    price.addEventListener(
        'blur',
        function() {

            const raw =
                this.value
                    .replace(
                        /,/g,
                        ''
                    );


            if (
                raw !== '' &&
                !isNaN(raw)
            ) {

                this.value =
                    Number(raw)
                        .toLocaleString(
                            'ko-KR'
                        );

            }

        }
    );



    /* 입력 즉시 계산 */

    qty.addEventListener(
        'input',
        () => calcRow(tr)
    );


    price.addEventListener(
        'input',
        () => calcRow(tr)
    );



    /* 첫 번째 줄 자동 품목 */

    const autoName =
        () => {

            if (
                index === 0 &&
                !name.value &&
                (
                    month.value ||
                    day.value ||
                    price.value
                )
            ) {

                name.value =
                    '지게차 사용료';

            }

        };


    month.addEventListener(
        'change',
        autoName
    );


    day.addEventListener(
        'change',
        autoName
    );


    price.addEventListener(
        'change',
        autoName
    );



    /*
    두 번째 행 이후

    일 입력 →
    첫 행 월 / 품목 / 단가 자동복사
    */

    day.addEventListener(
        'change',
        function() {

            if (
                index > 0 &&
                this.value
            ) {

                const firstRow =
                    document.querySelector(
                        '#itemTable tr'
                    );


                const firstMonth =
                    firstRow
                        .querySelector('.m')
                        .value;


                const firstName =
                    firstRow
                        .querySelector('.name')
                        .value;


                const firstPrice =
                    firstRow
                        .querySelector('.price')
                        .value;



                if (
                    firstMonth &&
                    !month.value
                ) {

                    month.value =
                        firstMonth;

                }



                if (
                    firstName &&
                    !name.value
                ) {

                    name.value =
                        firstName;

                }



                if (
                    firstPrice &&
                    !price.value
                ) {

                    price.value =
                        firstPrice;

                }


                calcRow(tr);

            }

        }
    );

}



/* =========================================================
   행 계산
========================================================= */

function calcRow(tr) {


    const qty =
        parseFloat(
            tr
                .querySelector('.qty')
                .value
        ) || 0;



    const price =
        parseFloat(

            (
                tr
                    .querySelector('.price')
                    .value
                || ''
            )
                .replace(
                    /,/g,
                    ''
                )

        ) || 0;



    const supply =
        Math.round(
            qty * price
        );



    const tax =
        Math.round(
            supply * 0.1
        );



    tr
        .querySelector('.supply')
        .value =

        supply > 0
            ? supply.toLocaleString('ko-KR')
            : '';



    tr
        .querySelector('.tax')
        .value =

        tax > 0
            ? tax.toLocaleString('ko-KR')
            : '';



    calcTotals();

}



/* =========================================================
   합계
========================================================= */

function calcTotals() {


    let qty = 0;

    let supply = 0;

    let tax = 0;



    document
        .querySelectorAll(
            '#itemTable tr'
        )
        .forEach(
            tr => {


                qty +=
                    parseFloat(
                        tr
                            .querySelector('.qty')
                            .value
                    ) || 0;



                supply +=
                    parseFloat(

                        (
                            tr
                                .querySelector('.supply')
                                .value
                            || ''
                        )
                            .replace(
                                /,/g,
                                ''
                            )

                    ) || 0;



                tax +=
                    parseFloat(

                        (
                            tr
                                .querySelector('.tax')
                                .value
                            || ''
                        )
                            .replace(
                                /,/g,
                                ''
                            )

                    ) || 0;

            }
        );



    const total =
        supply + tax;



    const format =
        value =>
            Number(value)
                .toLocaleString(
                    'ko-KR'
                );



    document
        .getElementById('sumQty')
        .value =
        qty
            ? format(qty)
            : '';



    document
        .getElementById('sumSupply')
        .value =
        supply
            ? format(supply)
            : '';



    document
        .getElementById('sumTax')
        .value =
        tax
            ? format(tax)
            : '';



    document
        .getElementById('totalAmount')
        .textContent =
        total
            ? format(total)
            : '';



    document
        .getElementById('totalKorean')
        .textContent =
        total
            ? numToKorean(total)
            : '';



    document
        .getElementById('finalTotal')
        .value =
        total
            ? format(total)
            : '';

}



/* =========================================================
   초기화
========================================================= */

function clearForm() {


    if (
        !confirm(
            '정말 초기화하시겠습니까?'
        )
    ) {
        return;
    }



    document
        .getElementById('buyerName')
        .value =
        '';



    document
        .getElementById('notes')
        .value =
        '';



    document
        .querySelectorAll(
            '#itemTable input'
        )
        .forEach(
            input => {

                input.value =
                    '';

            }
        );



    calcTotals();

}



/* =========================================================
   이미지 다운로드
========================================================= */

async function downloadImage() {


    const element =
        document.getElementById(
            'invoiceFrame'
        );



    const canvas =
        await html2canvas(
            element,
            {

                scale: 3,

                backgroundColor:
                    '#ffffff',

                useCORS: true,

                logging: false

            }
        );



    const link =
        document.createElement(
            'a'
        );



    link.href =
        canvas.toDataURL(
            'image/png',
            1
        );



    link.download =
        '거래명세서_' +
        Date.now() +
        '.png';



    link.click();

}



/* =========================================================
   PDF
========================================================= */

function downloadPDF() {


    const element =
        document.getElementById(
            'invoiceFrame'
        );



    const options = {


        margin: [
            10,
            10,
            10,
            10
        ],


        filename:
            '거래명세서_' +
            Date.now() +
            '.pdf',


        image: {

            type:
                'jpeg',

            quality:
                1

        },


        html2canvas: {

            scale:
                3,

            backgroundColor:
                '#ffffff',

            useCORS:
                true,

            logging:
                false

        },


        jsPDF: {

            orientation:
                'portrait',

            unit:
                'mm',

            format:
                'a4'

        },


        pagebreak: {

            mode: [
                'avoid-all',
                'css',
                'legacy'
            ]

        }

    };



    html2pdf()
        .set(options)
        .from(element)
        .save();

}



/* =========================================================
   페이지 로드
========================================================= */

window.addEventListener(
    'load',
    () => {


        if (
            sessionStorage.getItem(
                'authenticated'
            ) === 'true'
        ) {


            document
                .getElementById(
                    'authContainer'
                )
                .classList
                .add('hidden');



            document
                .getElementById(
                    'appWrapper'
                )
                .classList
                .add('active');



            initForm();

        }

    }
);


</script>


</body>
</html>
