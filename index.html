<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>거래명세서</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

    <!-- =====================================================
         인증
    ====================================================== -->

    <div class="auth-container" id="authContainer">

        <div class="auth-box">

            <h1>거래명세서</h1>

            <p>접근 코드를 입력하세요</p>

            <div
                id="authError"
                class="auth-error"
            ></div>

            <input
                type="password"
                id="accessCode"
                placeholder="접근 코드"
                onkeypress="if(event.key === 'Enter') authenticate()"
            >

            <button onclick="authenticate()">
                접근
            </button>

        </div>

    </div>


    <!-- =====================================================
         앱
    ====================================================== -->

    <div
        class="app-wrapper"
        id="appWrapper"
    >

        <div class="header">

            <button
                class="logout-btn"
                onclick="logout()"
            >
                로그아웃
            </button>

        </div>


        <!-- =================================================
             A4 종이
        ================================================== -->

        <div class="paper">

            <div
                class="invoice-frame"
                id="invoiceFrame"
            >


                <!-- =========================================
                     제목
                ========================================== -->

                <div class="invoice-title">
                    거 래 명 세 서
                </div>


                <!-- =========================================
                     상단
                ========================================== -->

                <table class="top-table">

                    <colgroup>
                        <col style="width:42%">
                        <col style="width:7%">
                        <col style="width:51%">
                    </colgroup>

                    <tbody>

                        <tr>

                            <!-- 공급받는 자 -->

                            <td class="top-cell">

                                <table class="buyer-table">

                                    <tbody>

                                        <tr>

                                            <td class="date-cell">

                                                <div class="date-box">

                                                    <input
                                                        class="date-input year"
                                                        id="year"
                                                        type="number"
                                                        min="2000"
                                                        max="2100"
                                                    >

                                                    <span>년</span>

                                                    <input
                                                        class="date-input small"
                                                        id="month"
                                                        type="number"
                                                        min="1"
                                                        max="12"
                                                    >

                                                    <span>월</span>

                                                    <input
                                                        class="date-input small"
                                                        id="day"
                                                        type="number"
                                                        min="1"
                                                        max="31"
                                                    >

                                                    <span>일</span>

                                                </div>

                                            </td>

                                        </tr>


                                        <tr>

                                            <td class="buyer-cell">

                                                <div class="buyer-row">

                                                    <input
                                                        id="buyerName"
                                                        type="text"
                                                        placeholder="회사명(업체명) 입력"
                                                    >

                                                    <span class="gwiha">
                                                        귀하
                                                    </span>

                                                </div>

                                            </td>

                                        </tr>


                                        <tr>

                                            <td class="calc-cell">
                                                아래와 같이 계산합니다.
                                            </td>

                                        </tr>

                                    </tbody>

                                </table>

                            </td>


                            <!-- 공급자 세로칸 -->

                            <td class="supplier-vertical">
                                공급자
                            </td>


                            <!-- 공급자 정보 -->

                            <td class="top-cell">

                                <table class="supplier-table">

                                    <colgroup>
                                        <col style="width:23%">
                                        <col style="width:27%">
                                        <col style="width:18%">
                                        <col style="width:32%">
                                    </colgroup>

                                    <tbody>

                                        <tr>

                                            <td class="label-cell">
                                                등록번호
                                            </td>

                                            <td
                                                colspan="3"
                                                class="supplier-value"
                                            >
                                                107-62-66145
                                            </td>

                                        </tr>


                                        <tr>

                                            <td class="label-cell">
                                                상 호
                                            </td>

                                            <td class="supplier-value">
                                                삼우건기
                                            </td>

                                            <td class="label-cell">
                                                성 명
                                            </td>

                                    class="final-total"
                                    id="finalTotal"
                                    value="0"
                                    readonly
                                >

                            </td>

                        </tr>


                        <tr class="notes-row">

                            <td class="bottom-label">
                                비 고
                            </td>

                            <td colspan="3">

                                <textarea
                                    id="notes"
                                    class="notes-input"
                                    placeholder="현장명, 계좌번호, 기타 사항"
                                ></textarea>

                            </td>

                        </tr>

                    </tbody>

                </table>


            </div>

        </div>


        <!-- =================================================
             버튼
        ================================================== -->

        <div class="buttons">

            <button
                class="btn btn-primary"
                onclick="downloadImage()"
            >
                이미지로 다운로드
            </button>

            <button
                class="btn btn-primary"
                onclick="downloadPDF()"
            >
                PDF로 다운로드
            </button>

            <button
                class="btn btn-secondary"
                onclick="clearForm()"
            >
                초기화
            </button>

        </div>

    </div>


<script>

/* =========================================================
   접근코드
========================================================= */

const VALID_CODES = [
    'code123',
    'access456',
    'user789'
];


/* =========================================================
   인증
========================================================= */

function authenticate() {

    const code =
        document.getElementById('accessCode').value;

    if (VALID_CODES.includes(code)) {

        sessionStorage.setItem(
            'authenticated',
            'true'
        );

        document
            .getElementById('authContainer')
            .classList
            .add('hidden');

        document
            .getElementById('appWrapper')
            .classList
            .add('active');

        initForm();

    } else {

        document.getElementById(
            'authError'
        ).textContent =
            '잘못된 코드입니다.';

        document.getElementById(
            'accessCode'
        ).value = '';

    }

}


function logout() {

    sessionStorage.removeItem(
        'authenticated'
    );

    location.reload();

}


/* =========================================================
   숫자 → 한글금액
========================================================= */

function numToKorean(num) {

    if (num === 0) {
        return '';
    }

    const digits = [
        '',
        '일',
        '이',
        '삼',
        '사',
        '오',
        '육',
        '칠',
        '팔',
        '구'
    ];

    const bigUnits = [
        '',
        '만',
        '억',
        '조'
    ];

    let result = '';
    let bigIndex = 0;
    let n = Math.floor(num);

    while (n > 0) {

        const segment =
            n % 10000;

        if (segment > 0) {

            let segmentString = '';

            const thousand =
                Math.floor(
                    segment / 1000
                );

            const hundred =
                Math.floor(
                    (segment % 1000) /
                    100
                );

            const ten =
                Math.floor(
                    (segment % 100) /
                    10
                );

            const one =
                segment % 10;


            if (thousand > 0) {

                segmentString +=
                    thousand === 1
                    ? '일천'
                    : digits[thousand] + '천';

            }


            if (hundred > 0) {

                segmentString +=
                    hundred === 1
                    ? '일백'
                    : digits[hundred] + '백';

            }


            if (ten > 0) {

                segmentString +=
                    ten === 1
                    ? '십'
                    : digits[ten] + '십';

            }


            if (one > 0) {

                segmentString +=
                    digits[one];

            }


            result =
                segmentString +
                bigUnits[bigIndex] +
                result;

        }

        n =
            Math.floor(
                n / 10000
            );

        bigIndex++;

    }

    return result;

}


/* =========================================================
   초기화
========================================================= */

function initForm() {

    const today =
        new Date();

    document.getElementById(
        'year'
    ).value =
        today.getFullYear();

    document.getElementById(
        'month'
    ).value =
        today.getMonth() + 1;

    document.getElementById(
        'day'
    ).value =
        today.getDate();


    const tbody =
        document.getElementById(
            'itemTable'
        );

    tbody.innerHTML = '';


    /*
      1번 서식에 가까운 밀도를 위해
      15행 생성
    */
    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const tr =
            document.createElement(
                'tr'
            );

        tr.innerHTML = `

            <td>
                <input
                    class="table-input number m"
                    type="number"
                    min="1"
                    max="12"
                >
            </td>

            <td>
                <input
                    class="table-input number d"
                    type="number"
                    min="1"
                    max="31"
                >
            </td>

            <td>
                <input
                    class="table-input name"
                    type="text"
                >
            </td>

            <td>
                <input
                    class="table-input number qty"
                    type="number"
                    min="0"
                    step="0.01"
                >
            </td>

            <td>
                <input
                    class="table-input number price"
                    type="text"
                    inputmode="numeric"
                >
            </td>

            <td>
                <input
                    class="table-input number supply"
                    type="text"
                    readonly
                >
            </td>

            <td>
                <input
                    class="table-input number tax"
                    type="text"
                    readonly
                >
            </td>

            <td>
                <input
                    class="table-input remark"
                    type="text"
                >
            </td>

        `;

        bindRow(
            tr,
            i
        );

        tbody.appendChild(
            tr
        );

    }


    calcTotals();

}


/* =========================================================
   행별 이벤트
========================================================= */

function bindRow(
    tr,
    index
) {

    const m =
        tr.querySelector('.m');

    const d =
        tr.querySelector('.d');

    const name =
        tr.querySelector('.name');

    const qty =
        tr.querySelector('.qty');

    const price =
        tr.querySelector('.price');


    /*
      단가 숫자 콤마
    */
    price.addEventListener(
        'blur',
        function() {

            const raw =
                this.value
                    .replace(
                        /,/g,
                        ''
                    );

            if (
                raw !== '' &&
                !isNaN(raw)
            ) {

                this.value =
                    Number(raw)
                    .toLocaleString(
                        'ko-KR'
                    );

            }

        }
    );


    /*
      입력 즉시 계산
    */
    qty.addEventListener(
        'input',
        () => calcRow(tr)
    );

    price.addEventListener(
        'input',
        () => calcRow(tr)
    );


    /*
      첫 행 자동 품목
    */
    const autoName =
        () => {

            if (
                index === 0 &&
                !name.value &&
                (
                    m.value ||
                    d.value ||
                    price.value
                )
            ) {

                name.value =
                    '지게차 사용료';

            }

        };


    m.addEventListener(
        'change',
        autoName
    );

    d.addEventListener(
        'change',
        autoName
    );

    price.addEventListener(
        'change',
        autoName
    );


    /*
      2행 이후
      일자 입력 시
      첫 행의 월 / 품목 / 단가 복사
    */
    d.addEventListener(
        'change',
        function() {

            if (
                index > 0 &&
                this.value
            ) {

                const firstRow =
                    document.querySelector(
                        '#itemTable tr'
                    );

                const firstMonth =
                    firstRow
                        .querySelector('.m')
                        .value;

                const firstName =
                    firstRow
                        .querySelector('.name')
                        .value;

                const firstPrice =
                    firstRow
                        .querySelector('.price')
                        .value;


                if (
                    firstMonth &&
                    !m.value
                ) {

                    m.value =
                        firstMonth;

                }


                if (
                    firstName &&
                    !name.value
                ) {

                    name.value =
                        firstName;

                }


                if (
                    firstPrice &&
                    !price.value
                ) {

                    price.value =
                        firstPrice;

                }


                calcRow(tr);

            }

        }
    );

}


/* =========================================================
   행 계산
========================================================= */

function calcRow(tr) {

    const qty =
        parseFloat(
            tr.querySelector(
                '.qty'
            ).value
        ) || 0;


    const price =
        parseFloat(
            (
                tr.querySelector(
                    '.price'
                ).value || ''
            )
            .replace(
                /,/g,
                ''
            )
        ) || 0;


    const supply =
        Math.round(
            qty * price
        );


    const tax =
        Math.round(
            supply * 0.1
        );


    tr.querySelector(
        '.supply'
    ).value =
        supply > 0
        ? supply.toLocaleString(
            'ko-KR'
        )
        : '';


    tr.querySelector(
        '.tax'
    ).value =
        tax > 0
        ? tax.toLocaleString(
            'ko-KR'
        )
        : '';


    calcTotals();

}


/* =========================================================
   전체 합계
========================================================= */

function calcTotals() {

    let totalQty = 0;
    let totalSupply = 0;
    let totalTax = 0;


    document
        .querySelectorAll(
            '#itemTable tr'
        )
        .forEach(
            tr => {

                totalQty +=
                    parseFloat(
                        tr.querySelector(
                            '.qty'
                        ).value
                    ) || 0;


                totalSupply +=
                    parseFloat(
                        (
                            tr.querySelector(
                                '.supply'
                            ).value || ''
                        )
                        .replace(
                            /,/g,
                            ''
                        )
                    ) || 0;


                totalTax +=
                    parseFloat(
                        (
                            tr.querySelector(
                                '.tax'
                            ).value || ''
                        )
                        .replace(
                            /,/g,
                            ''
                        )
                    ) || 0;

            }
        );


    const total =
        totalSupply +
        totalTax;


    const format =
        value =>
            Number(value)
            .toLocaleString(
                'ko-KR'
            );


    document.getElementById(
        'sumQty'
    ).value =
        totalQty
        ? format(totalQty)
        : '';


    document.getElementById(
        'sumSupply'
    ).value =
        totalSupply
        ? format(totalSupply)
        : '';


    document.getElementById(
        'sumTax'
    ).value =
        totalTax
        ? format(totalTax)
        : '';


    document.getElementById(
        'totalAmount'
    ).textContent =
        total
        ? format(total)
        : '';


    document.getElementById(
        'totalKorean'
    ).textContent =
        total
        ? numToKorean(total)
        : '';


    document.getElementById(
        'finalTotal'
    ).value =
        total
        ? format(total)
        : '';

}


/* =========================================================
   초기화 버튼
========================================================= */

function clearForm() {

    const result =
        confirm(
            '정말 초기화하시겠습니까?'
        );

    if (!result) {
        return;
    }


    document.getElementById(
        'buyerName'
    ).value = '';


    document.getElementById(
        'notes'
    ).value = '';


    document.getElementById(
        'previousBalance'
    ).value = '';


    document
        .querySelectorAll(
            '#itemTable input'
        )
        .forEach(
            input => {

                input.value = '';

            }
        );


    calcTotals();

}


/* =========================================================
   이미지 다운로드
========================================================= */

async function downloadImage() {

    const element =
        document.getElementById(
            'invoiceFrame'
        );


    const canvas =
        await html2canvas(
            element,
            {
                scale: 3,
                backgroundColor:
                    '#ffffff',

                useCORS: true,

                logging: false,

                windowWidth:
                    element.scrollWidth,

                windowHeight:
                    element.scrollHeight
            }
        );


    const link =
        document.createElement(
            'a'
        );


    link.href =
        canvas.toDataURL(
            'image/png',
            1.0
        );


    link.download =
        '거래명세서_' +
        new Date().getTime() +
        '.png';


    link.click();

}


/* =========================================================
   PDF 다운로드
========================================================= */

function downloadPDF() {

    const element =
        document.getElementById(
            'invoiceFrame'
        );


    const options = {

        margin: [
            10,
            10,
            10,
            10
        ],

        filename:
            '거래명세서_' +
            new Date().getTime() +
            '.pdf',

        image: {
            type: 'jpeg',
            quality: 1
        },

        html2canvas: {

            scale: 3,

            backgroundColor:
                '#ffffff',

            useCORS: true,

            logging: false,

            scrollX: 0,

            scrollY: 0

        },

        jsPDF: {

            orientation:
                'portrait',

            unit:
                'mm',

            format:
                'a4'

        },

        pagebreak: {

            mode: [
                'avoid-all',
                'css',
                'legacy'
            ]

        }

    };


    html2pdf()
        .set(options)
        .from(element)
        .save();

}


/* =========================================================
   로드
========================================================= */

window.addEventListener(
    'load',
    () => {

        if (
            sessionStorage.getItem(
                'authenticated'
            ) === 'true'
        ) {

            document
                .getElementById(
                    'authContainer'
                )
                .classList
                .add(
                    'hidden'
                );


            document
                .getElementById(
                    'appWrapper'
                )
                .classList
                .add(
                    'active'
                );


            initForm();

        }

    }
);

</script>
