<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래명세서</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .auth-box h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .auth-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .auth-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .auth-box button:hover {
            transform: translateY(-2px);
        }

        .auth-error {
            color: #e74c3c;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .auth-container.hidden {
            display: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: none;
        }

        .container.active {
            display: block;
        }

        .header {
            text-align: right;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .invoice-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .invoice-date {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            align-items: center;
        }

        .invoice-date input {
            width: 50px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }

        .invoice-date span {
            font-weight: bold;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 13px;
        }

        th {
            background: #f9f9f9;
            font-weight: bold;
            text-align: center;
        }

        td {
            height: 35px;
        }

        td input {
            width: 100%;
            padding: 5px;
            border: none;
            text-align: right;
        }

        td input:focus {
            outline: none;
            background: #fffacd;
        }

        .text-center {
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .notes {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .notes textarea {
            width: 100%;
            height: 80px;
        }

        .total-section {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .total-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-item label {
            font-weight: bold;
            font-size: 13px;
        }

        .total-item input {
            width: 40%;
            text-align: right;
        }

        @media print {
            body {
                background: white;
            }
            .buttons, .logout-btn, .auth-container {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
        }

        .row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .row.full {
            grid-template-columns: 1fr;
        }

        .info-section {
            background: #fafafa;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <!-- 인증 화면 -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h1>거래명세서</h1>
            <p>접근 코드를 입력하세요</p>
            <div id="authError" class="auth-error"></div>
            <input type="password" id="accessCode" placeholder="접근 코드" onkeypress="if(event.key==='Enter') authenticate()">
            <button onclick="authenticate()">접근</button>
        </div>
    </div>

    <!-- 메인 앱 -->
    <div class="container" id="mainContainer">
        <div class="header">
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>

        <div class="invoice-title">거 래 명 세 서</div>

        <div class="invoice-date">
            <span>발행일:</span>
            <input type="number" id="year" min="2000" max="2100" value="2024">
            <span>년</span>
            <input type="number" id="month" min="1" max="12" value="8">
            <span>월</span>
            <input type="number" id="day" min="1" max="31" value="20">
            <span>일</span>
        </div>

        <!-- 공급자 정보 -->
        <div class="section">
            <div class="section-title">공급자 정보</div>
            <div class="row">
                <div class="form-group">
                    <label>상호</label>
                    <input type="text" id="supplierName" placeholder="(주) 회사명">
                </div>
                <div class="form-group">
                    <label>등록번호</label>
                    <input type="text" id="supplierReg" placeholder="123-45-67890">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>대표자 성명</label>
                    <input type="text" id="supplierCEO" placeholder="김철수">
                </div>
                <div class="form-group">
                    <label>사업장 주소</label>
                    <input type="text" id="supplierAddress" placeholder="서울시 강남구...">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>업태</label>
                    <input type="text" id="supplierType" placeholder="도매">
                </div>
                <div class="form-group">
                    <label>종목</label>
                    <input type="text" id="supplierItem" placeholder="의류">
                </div>
            </div>
        </div>

        <!-- 공급받는자 정보 -->
        <div class="section">
            <div class="section-title">공급받는자 정보</div>
            <div class="row">
                <div class="form-group">
                    <label>상호</label>
                    <input type="text" id="buyerName" placeholder="(주) 회사명">
                </div>
                <div class="form-group">
                    <label>등록번호</label>
                    <input type="text" id="buyerReg" placeholder="123-45-67890">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>대표자 성명</label>
                    <input type="text" id="buyerCEO" placeholder="이영희">
                </div>
                <div class="form-group">
                    <label>사업장 주소</label>
                    <input type="text" id="buyerAddress" placeholder="서울시 중구...">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>업태</label>
                    <input type="text" id="buyerType" placeholder="소매">
                </div>
                <div class="form-group">
                    <label>종목</label>
                    <input type="text" id="buyerItem" placeholder="의류판매">
                </div>
            </div>
        </div>

        <!-- 거래 상세 -->
        <div class="section">
            <div class="section-title">거래 상세</div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 8%">월</th>
                        <th style="width: 8%">일</th>
                        <th style="width: 30%">품목</th>
                        <th style="width: 10%">수량</th>
                        <th style="width: 12%">단가</th>
                        <th style="width: 12%">공급가액</th>
                        <th style="width: 12%">세액</th>
                        <th style="width: 8%">비고</th>
                    </tr>
                </thead>
                <tbody id="itemTable">
                </tbody>
            </table>
        </div>

        <!-- 합계 -->
        <div class="section">
            <div class="total-section">
                <div class="total-item">
                    <label>공급가액 합계:</label>
                    <input type="text" id="totalSupply" readonly value="0">
                </div>
                <div class="total-item">
                    <label>세액 합계:</label>
                    <input type="text" id="totalTax" readonly value="0">
                </div>
                <div class="total-item">
                    <label>총 합계금액:</label>
                    <input type="text" id="totalAmount" readonly value="0">
                </div>
                <div class="total-item">
                    <label>원화 표시:</label>
                    <input type="text" id="totalDisplay" readonly value="0">
                </div>
            </div>
        </div>

        <!-- 비고 -->
        <div class="section">
            <div class="section-title">비고</div>
            <div class="notes">
                <textarea id="notes" placeholder="현장명, 계좌번호, 기타 사항 등"></textarea>
            </div>
        </div>

        <!-- 버튼 -->
        <div class="buttons">
            <button class="btn btn-primary" onclick="downloadPDF()">📥 PDF로 다운로드</button>
            <button class="btn btn-primary" onclick="downloadImage()">🖼️ 이미지로 다운로드</button>
            <button class="btn btn-secondary" onclick="clearForm()">🔄 초기화</button>
        </div>
    </div>

    <script>
        // 초대 코드 설정 (이 부분을 수정해서 사용하세요)
        const VALID_CODES = ['1234', '5678', '9012']; // 여기에 초대 코드 추가

        // 인증 체크
        function authenticate() {
            const code = document.getElementById('accessCode').value;
            if (VALID_CODES.includes(code)) {
                sessionStorage.setItem('authenticated', 'true');
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('mainContainer').classList.add('active');
                initForm();
            } else {
                document.getElementById('authError').textContent = '잘못된 코드입니다.';
                document.getElementById('accessCode').value = '';
            }
        }

        function logout() {
            sessionStorage.removeItem('authenticated');
            location.reload();
        }

        function initForm() {
            // 테이블 생성
            generateTable();
            
            // 이벤트 리스너
            document.getElementById('itemTable').addEventListener('change', calculateTotals);
        }

        function generateTable() {
            const tbody = document.getElementById('itemTable');
            tbody.innerHTML = '';
            
            for (let i = 0; i < 15; i++) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="text-center"><input type="number" class="month-input" min="1" max="12" value="8"></td>
                    <td class="text-center"><input type="number" class="day-input" min="1" max="31" value=""></td>
                    <td><input type="text" class="item-input" placeholder="품목명"></td>
                    <td class="text-center"><input type="number" class="qty-input" min="0" step="0.01"></td>
                    <td class="text-center"><input type="number" class="price-input" min="0" step="100"></td>
                    <td class="text-center"><input type="number" class="supply-input" readonly></td>
                    <td class="text-center"><input type="number" class="tax-input" readonly></td>
                    <td><input type="text" class="note-input" placeholder=""></td>
                `;
                
                // 수량, 단가 변경시 공급가액, 세액 자동 계산
                const qtyInput = row.querySelector('.qty-input');
                const priceInput = row.querySelector('.price-input');
                
                qtyInput.addEventListener('change', () => calculateRowAmount(row));
                priceInput.addEventListener('change', () => calculateRowAmount(row));
                
                tbody.appendChild(row);
            }
        }

        function calculateRowAmount(row) {
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            const supply = qty * price;
            const tax = Math.round(supply * 0.1);
            
            row.querySelector('.supply-input').value = supply > 0 ? supply.toLocaleString('ko-KR') : '';
            row.querySelector('.tax-input').value = tax > 0 ? tax.toLocaleString('ko-KR') : '';
            
            calculateTotals();
        }

        function calculateTotals() {
            const rows = document.querySelectorAll('#itemTable tr');
            let totalSupply = 0;
            let totalTax = 0;
            
            rows.forEach(row => {
                const supply = parseFloat(row.querySelector('.supply-input').value) || 0;
                const tax = parseFloat(row.querySelector('.tax-input').value) || 0;
                totalSupply += supply;
                totalTax += tax;
            });
            
            const totalAmount = totalSupply + totalTax;
            
            document.getElementById('totalSupply').value = totalSupply.toLocaleString('ko-KR');
            document.getElementById('totalTax').value = totalTax.toLocaleString('ko-KR');
            document.getElementById('totalAmount').value = totalAmount.toLocaleString('ko-KR');
            document.getElementById('totalDisplay').value = `(₩ ${totalAmount.toLocaleString('ko-KR')})`;
        }

        function downloadPDF() {
            const element = document.getElementById('mainContainer');
            const opt = {
                margin: 10,
                filename: `거래명세서_${new Date().getTime()}.pdf`,
                image: { type: 'png', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function downloadImage() {
            const element = document.getElementById('mainContainer');
            html2canvas(element, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `거래명세서_${new Date().getTime()}.png`;
                link.click();
            });
        }

        function clearForm() {
            if (confirm('정말 초기화하시겠습니까?')) {
                document.getElementById('supplierName').value = '';
                document.getElementById('supplierReg').value = '';
                document.getElementById('supplierCEO').value = '';
                document.getElementById('supplierAddress').value = '';
                document.getElementById('supplierType').value = '';
                document.getElementById('supplierItem').value = '';
                
                document.getElementById('buyerName').value = '';
                document.getElementById('buyerReg').value = '';
                document.getElementById('buyerCEO').value = '';
                document.getElementById('buyerAddress').value = '';
                document.getElementById('buyerType').value = '';
                document.getElementById('buyerItem').value = '';
                
                document.getElementById('notes').value = '';
                
                document.querySelectorAll('#itemTable input').forEach(input => {
                    if (input.classList.contains('month-input')) {
                        input.value = '8';
                    } else if (input.classList.contains('day-input')) {
                        input.value = '';
                    } else {
                        input.value = '';
                    }
                });
                
                calculateTotals();
            }
        }

        // 페이지 로드시 인증 체크
        window.addEventListener('load', () => {
            const authenticated = sessionStorage.getItem('authenticated');
            if (authenticated === 'true') {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('mainContainer').classList.add('active');
                initForm();
            }
        });
    </script>
</body>
</html>
