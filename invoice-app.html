<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래명세서</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== 인증 화면 ===== */
        .auth-container {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
        }
        .auth-box {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
            max-width: 400px; width: 100%;
        }
        .auth-box h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .auth-box p { color: #666; margin-bottom: 30px; font-size: 14px; }
        .auth-box input {
            width: 100%; padding: 12px 15px; margin-bottom: 20px;
            border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;
        }
        .auth-box input:focus { outline: none; border-color: #667eea; }
        .auth-box button {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .auth-box button:hover { transform: translateY(-2px); }
        .auth-error { color: #e74c3c; font-size: 14px; margin-bottom: 15px; }
        .auth-container.hidden { display: none; }

        .app-wrapper { max-width: 950px; margin: 0 auto; display: none; }
        .app-wrapper.active { display: block; }
        .header { text-align: right; margin-bottom: 15px; }
        .logout-btn {
            background: #e74c3c; color: white; padding: 8px 15px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 12px;
        }
        .logout-btn:hover { background: #c0392b; }

        .container {
            background: white; padding: 25px; border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        /* ===== 거래명세서 표 ===== */
        table { border-collapse: collapse; width: 100%; }
        table.fixed-layout { table-layout: fixed; }
        .inv td { border: 1.5px solid #000; padding: 8px 10px; font-size: 13px; vertical-align: middle; }

        /* 전체 프레임: 큰 테두리 굵게 */
        .invoice-frame { border: 1.5px solid #000; }

        /* 제목 */
        .invoice-title {
            text-align: center; font-size: 32px; font-weight: 900;
            letter-spacing: 10px; padding: 16px 0;
            border: none; border-bottom: 1.5px solid #000;
        }

        /* 공급자칸 아래 선 (일반 굵기와 동일) */
        .supplier-table tr:last-child td { border-bottom: 1.5px solid #000; }

        /* 합계금액 행: 눈에 보이는 칸 없음, 모든 글씨 동일 선상 */
        .sum-row td {
            border: none !important;
            padding: 8px 10px;
            position: relative;
            vertical-align: middle;
            text-align: center;
        }
        .sum-row td span.pos {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
        }

        .cell-label { font-weight: bold; text-align: center; }
        .fixed-val { font-weight: bold; }

        /* 세로 '공급자' 칸 */
        .vert-label {
            writing-mode: vertical-rl; text-orientation: upright;
            letter-spacing: 6px; font-weight: bold; font-size: 15px;
            text-align: center; white-space: nowrap;
            padding: 10px 6px !important;
        }

        /* 입력 필드 (밑줄 없음) */
        .inp {
            width: 100%; border: none; background: transparent;
            font-size: 14px; padding: 4px 2px; font-family: inherit;
        }
        .inp:focus { outline: none; background: #f5f7ff; }

        /* 날짜 */
        .date-box { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; }
        .date-box .inp { width: 56px; text-align: center; font-weight: bold; font-size: 15px; }
        .date-box .inp.mm { width: 36px; }
        .date-box .inp.dd { width: 36px; }

        /* 회사명 + 귀하 */
        .buyer-row { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; width: 100%; }
        #buyerName { flex: 1; text-align: center; font-size: 16px; font-weight: bold; letter-spacing: 1px; border: none; }
        .gwi-ha { font-weight: bold; font-size: 15px; white-space: nowrap; }

        .calc-note { text-align: center; font-weight: bold; font-size: 14px; }

        /* 도장 */
        .supplier-cell { position: relative; }
        .seal-img {
            position: absolute; top: 2px; right: 2px;
            width: 52px; height: auto; opacity: 0.92; z-index: 2;
            pointer-events: none;
        }

        /* ===== 거래내역 ===== */
        .items { table-layout: fixed; }
        .items th, .items td { border: 1.5px solid #000; padding: 4px 5px; font-size: 13px; height: 28px; }
        .items th { background: #f7f7f7; font-weight: bold; text-align: center; }
        .items input {
            width: 100%; border: none; background: transparent;
            font-size: 13px; padding: 2px; font-family: inherit;
        }
        .items input:focus { outline: none; background: #fffacd; }
        .items input.num { text-align: right; }

        /* 하단 */
        .readonly-box {
            width: 100%; background: transparent; border: none;
            text-align: right; font-size: 14px; font-weight: bold; color: #000;
        }
        textarea.inp-ta {
            width: 100%; border: none; font-size: 13px;
            font-family: inherit; resize: vertical; min-height: 42px; padding: 2px;
        }
        textarea.inp-ta:focus { outline: none; background: #f5f7ff; }

        /* 버튼 */
        .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .btn {
            padding: 12px 28px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: bold; transition: all .3s;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,.4); }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }

        @media print {
            body { background: white; padding: 0; }
            .buttons, .logout-btn, .auth-container, .header { display: none; }
            .container { box-shadow: none; padding: 0; }
        }
        @media (max-width: 600px) {
            .inv td { font-size: 11px; padding: 5px 7px; }
            .invoice-title { font-size: 22px; letter-spacing: 6px; }
        }
    </style>
</head>
<body>
    <!-- 인증 화면 -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h1>거래명세서</h1>
            <p>접근 코드를 입력하세요</p>
            <div id="authError" class="auth-error"></div>
            <input type="password" id="accessCode" placeholder="접근 코드" onkeypress="if(event.key==='Enter') authenticate()">
            <button onclick="authenticate()">접근</button>
        </div>
    </div>

    <!-- 메인 앱 -->
    <div class="app-wrapper" id="appWrapper">
        <div class="header">
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>

        <div class="container" id="invoiceContainer">
            <div class="invoice-frame">
            <!-- ===== 제목 ===== -->
            <div class="invoice-title">거 래 명 세 서</div>

            <!-- ===== 상단: 공급받는자(5) | 공급자세로(1) | 공급자정보(6) = 12열 ===== -->
            <table class="inv">
                <tr>
                    <!-- 좌측: 공급받는자 (5열: 월 일 품목) -->
                    <td colspan="5" style="padding: 0; vertical-align: top; width: 41.67%;">
                        <table style="width: 100%;">
                            <!-- 1행: 일자 (등록번호칸과 높이 동일) -->
                            <tr>
                                <td style="height: 46px;">
                                    <div class="date-box">
                                        <input class="inp yy" id="year" type="number" min="2000" max="2100"> 년
                                        <input class="inp mm" id="month" type="number" min="1" max="12"> 월
                                        <input class="inp dd" id="day" type="number" min="1" max="31"> 일
                                    </div>
                                </td>
                            </tr>
                            <!-- 2행: 회사명+귀하 (상호+성명, 사업장소재지 높이 합) -->
                            <tr>
                                <td style="height: 92px;">
                                    <div class="buyer-row">
                                        <input class="inp" id="buyerName" placeholder="회사명(업체명) 입력">
                                        <span class="gwi-ha">귀하</span>
                                    </div>
                                </td>
                            </tr>
                            <!-- 3행: 아래와 같이 계산합니다 (업태칸과 높이 동일) -->
                            <tr>
                                <td class="calc-note" style="height: 46px;">아래와 같이 계산합니다.</td>
                            </tr>
                        </table>
                    </td>

                    <!-- 중간: 세로 '공급자' (1열) -->
                    <td class="vert-label" style="width: 8.33%;">공급자</td>

                    <!-- 우측: 공급자 정보 (6열) -->
                    <td colspan="6" style="padding: 0; vertical-align: top; width: 50%;">
                        <table class="supplier-table" style="width: 100%;">
                            <tr>
                                <td class="cell-label" style="width: 26%; height: 46px;">등록번호</td>
                                <td colspan="3" class="fixed-val" style="width: 74%;">107-62-66145</td>
                            </tr>
                            <tr>
                                <td class="cell-label" style="height: 46px;">상 호</td>
                                <td class="fixed-val" style="width: 27%;">삼우건기</td>
                                <td class="cell-label" style="width: 19%;">성 명</td>
                                <td class="fixed-val supplier-cell" style="width: 28%;">
                                    김재성

    <script>
        // ===== 초대 코드 (필요시 수정) =====
        const VALID_CODES = ['code123', 'access456', 'user789'];

        // ===== 인증 =====
        function authenticate() {
            const code = document.getElementById('accessCode').value;
            if (VALID_CODES.includes(code)) {
                sessionStorage.setItem('authenticated', 'true');
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('appWrapper').classList.add('active');
                initForm();
            } else {
                document.getElementById('authError').textContent = '잘못된 코드입니다.';
                document.getElementById('accessCode').value = '';
            }
        }
        function logout() {
            sessionStorage.removeItem('authenticated');
            location.reload();
        }

        // ===== 숫자 → 한글 금액 변환 =====
        function numToKorean(num) {
            if (num === 0) return '영';
            const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
            const bigUnits = ['', '만', '억', '조'];
            let result = '';
            let bigIdx = 0;
            let n = num;
            while (n > 0) {
                const seg = n % 10000;
                if (seg > 0) {
                    let segStr = '';
                    const th = Math.floor(seg / 1000);
                    const hu = Math.floor((seg % 1000) / 100);
                    const te = Math.floor((seg % 100) / 10);
                    const on = seg % 10;
                    if (th > 0) segStr += (th === 1 ? '일천' : digits[th] + '천');
                    if (hu > 0) segStr += (hu === 1 ? '일백' : digits[hu] + '백');
                    if (te > 0) segStr += (te === 1 ? '십' : digits[te] + '십');
                    if (on > 0) segStr += digits[on];
                    result = segStr + bigUnits[bigIdx] + result;
                }
                n = Math.floor(n / 10000);
                bigIdx++;
            }
            return result;
        }

        // ===== 초기화 =====
        function initForm() {
            // 오늘 날짜 자동 기입 (수정 가능)
            const today = new Date();
            document.getElementById('year').value = today.getFullYear();
            document.getElementById('month').value = today.getMonth() + 1;
            document.getElementById('day').value = today.getDate();

            // 거래내역 테이블 생성 (12열: 비고 없음)
            const tbody = document.getElementById('itemTable');
            tbody.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input class="num m" type="number" min="1" max="12"></td>
                    <td><input class="num d" type="number" min="1" max="31"></td>
                    <td colspan="3"><input class="name" type="text" placeholder=""></td>
                    <td><input class="num qty" type="number" min="0" step="0.01"></td>
                    <td colspan="2"><input class="num price" type="text" inputmode="numeric"></td>
                    <td colspan="2"><input class="num supply" type="text" readonly></td>
                    <td colspan="2"><input class="num tax" type="text" readonly></td>
                `;
                bindRow(tr, i);
                tbody.appendChild(tr);
            }
        }

        // ===== 행별 이벤트 =====
        function bindRow(tr, index) {
            const m = tr.querySelector('.m');
            const d = tr.querySelector('.d');
            const name = tr.querySelector('.name');
            const qty = tr.querySelector('.qty');
            const price = tr.querySelector('.price');

            // 단가 콤마 포맷 (입력 완료 시점에 적용)
            price.addEventListener('blur', function() {
                const raw = this.value.replace(/,/g, '');
                if (raw && !isNaN(raw)) {
                    this.value = Number(raw).toLocaleString('ko-KR');
                }
            });

            // 수량/단가 변경 시 계산
            qty.addEventListener('change', () => calcRow(tr));
            price.addEventListener('change', () => calcRow(tr));

            // 첫 행: 월/일/단가 입력 시 품목 '지게차 사용료' 자동
            const autoName = () => {
                if (index === 0 && !name.value && (m.value || d.value || price.value)) {
                    name.value = '지게차 사용료';
                }
            };
            m.addEventListener('change', autoName);
            d.addEventListener('change', autoName);
            price.addEventListener('change', autoName);

            // 두번째 행부터: '일' 입력 시 '월', '품목', '단가' 첫 행과 동일하게
            d.addEventListener('change', function() {
                if (index > 0 && this.value) {
                    const firstRow = document.querySelector('#itemTable tr');
                    const firstM = firstRow.querySelector('.m').value;
                    const firstName = firstRow.querySelector('.name').value;
                    const firstPrice = firstRow.querySelector('.price').value;
                    if (firstM && !m.value) m.value = firstM;
                    if (firstName && !name.value) name.value = firstName;
                    if (firstPrice && !price.value) price.value = firstPrice;
                }
            });
        }

        // ===== 계산 =====
        function calcRow(tr) {
            const qty = parseFloat(tr.querySelector('.qty').value) || 0;
            const price = parseFloat((tr.querySelector('.price').value || '').replace(/,/g, '')) || 0;
            const supply = Math.round(qty * price);
            const tax = Math.round(supply * 0.1);
            tr.querySelector('.supply').value = supply > 0 ? supply.toLocaleString('ko-KR') : '';
            tr.querySelector('.tax').value = tax > 0 ? tax.toLocaleString('ko-KR') : '';
            calcTotals();
        }

        function calcTotals() {
            let qty = 0, supply = 0, tax = 0;
            document.querySelectorAll('#itemTable tr').forEach(tr => {
                qty += parseFloat(tr.querySelector('.qty').value) || 0;
                supply += parseFloat((tr.querySelector('.supply').value || '').replace(/,/g, '')) || 0;
                tax += parseFloat((tr.querySelector('.tax').value || '').replace(/,/g, '')) || 0;
            });
            const total = supply + tax;
            const fmt = n => n.toLocaleString('ko-KR');
            document.getElementById('sumQty').value = fmt(qty);
            document.getElementById('sumSupply').value = fmt(supply);
            document.getElementById('sumTax').value = fmt(tax);
            document.getElementById('totalAmount').textContent = fmt(total);
            document.getElementById('totalKorean').textContent = numToKorean(total);
            document.getElementById('finalTotal').value = fmt(total);
        }

        // ===== 초기화 버튼 =====
        function clearForm() {
            if (!confirm('정말 초기화하시겠습니까?')) return;
            document.getElementById('buyerName').value = '';
            document.getElementById('notes').value = '';
            document.querySelectorAll('#itemTable input').forEach(inp => { inp.value = ''; });
            calcTotals();
        }

        // ===== 다운로드 =====
        function downloadImage() {
            const el = document.getElementById('invoiceContainer');
            html2canvas(el, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = '거래명세서_' + new Date().getTime() + '.png';
                a.click();
            });
        }

        function downloadPDF() {
            const el = document.getElementById('invoiceContainer');
            const opt = {
                margin: 5,
                filename: '거래명세서_' + new Date().getTime() + '.pdf',
                image: { type: 'png', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(el).save();
        }

        // ===== 로드 =====
        window.addEventListener('load', () => {
            if (sessionStorage.getItem('authenticated') === 'true') {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('appWrapper').classList.add('active');
                initForm();
            }
        });
    </script>
</body>
</html>
